name: E-Commerce Shopping Cart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode clean test

  integration-test:
    name: PostgreSQL Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shoppingcart
          POSTGRES_USER: cartuser
          POSTGRES_PASSWORD: cartpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartuser -d shoppingcart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run integration tests
        run: >-
          mvn --batch-mode verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/shoppingcart
          -Dspring.datasource.username=cartuser
          -Dspring.datasource.password=cartpassword

  package:
    name: Package Application
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopping-cart-application
          path: target/*.jar
          if-no-files-found: error

